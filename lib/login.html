<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to Your Account</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        input[type="email"], input[type="password"] {
            width: 80%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 80%;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Sign in to Your Account</h1>
    <form>
        <input type="email" placeholder="Your Email Address" required />
        <input type="password" placeholder="Your Password" required />
        <div class="remember-me">
            <label><input type="checkbox"> Remember Me</label>
        </div>
        <button type="submit">Sign in</button>
    </form>

    <p>or Sign in with:</p>
    <a href="#" onclick="window.location.href='https://www.google.com'; return false;">Google</a>
    <a href="#" onclick="window.location.href='https://www.facebook.com'; return false;">Facebook</a>

    <p>Don't have an account? <a href="#">Sign Up</a></p>
</div>

</body>
</html>
