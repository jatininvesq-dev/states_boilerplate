<svg width="297" height="362" viewBox="0 0 297 362" fill="none" xmlns="http://www.w3.org/2000/svg">

<style>
  #girl-hair-gentle {
    transform-box: fill-box;
    transform-origin: 88px 118px;
    animation: syncedHairMove 3.2s ease-in-out infinite;
  }

  

  #girl-head-natural {
    transform-box: fill-box;
    transform-origin: 88px 118px;
    animation: syncedHeadMove 3.2s ease-in-out infinite;
  }

  


  #slow-typing-hands {
    transform-box: fill-box;
    transform-origin: 125px 187px;
    animation: slowTypingHands 1.15s ease-in-out infinite;
  }

  @keyframes slowTypingHands {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(1.6px) rotate(-0.6deg); }
  }


  #typing-body-lean {
    transform-box: fill-box;
    transform-origin: 95px 205px;
    animation: naturalTypingLean 2.6s ease-in-out infinite;
  }

  @keyframes naturalTypingLean {
    0%, 100% { transform: translateX(0px) translateY(0px) rotate(0deg); }
    50% { transform: translateX(2px) translateY(0.8px) rotate(0.7deg); }
  }


  @keyframes syncedHairMove {
    0%, 100% { transform: rotate(0deg) translateY(0px); }
    50% { transform: rotate(0.65deg) translateY(0.5px); }
  }

  @keyframes syncedHeadMove {
    0%, 100% { transform: rotate(0deg) translateY(0px); }
    50% { transform: rotate(0.65deg) translateY(0.5px); }
  }

</style>

