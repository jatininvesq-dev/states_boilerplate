  <animateTransform
    attributeName="transform"
    type="rotate"
    from="0 149 37"
    to="360 149 37"
    dur="48s"
    repeatCount="indefinite"/>
</g>

<g id="clock-minute-hand">
  <path d="M149 37L149 9" stroke="#B6A68D" stroke-width="2.4" stroke-linecap="round"/>
  <animateTransform
    attributeName="transform"
    type="rotate"
    from="0 149 37"
    to="360 149 37"
    dur="4s"
    repeatCount="indefinite"/>
</g>

